services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: teacher_ai_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teacher_ai_system"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/teacher_ai_system
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      AI_DAILY_LIMIT_PER_IP: ${AI_DAILY_LIMIT_PER_IP:-3}
      AI_DAILY_LIMIT_GLOBAL: ${AI_DAILY_LIMIT_GLOBAL:-150}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required in production}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required, e.g. https://yourdomain.com}
      WEB_CONCURRENCY: ${BACKEND_WEB_CONCURRENCY:-1}
      # Read directly by docker-entrypoint.sh's uvicorn --forwarded-allow-ips
      # AND by the app itself (to warn if still left at the default) — see
      # README.md's Production Checklist before deploying behind a reverse proxy.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required in production (password reset emails)}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:?SMTP_FROM_EMAIL is required in production}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    ports:
      # Bound to localhost by default — a host-level reverse proxy (nginx,
      # aaPanel, Caddy...) is what actually faces the internet and terminates
      # HTTPS; the container port itself shouldn't be reachable from outside
      # the box. Override BACKEND_HOST_BIND=0.0.0.0 only if you really want
      # this exposed directly (uncommon).
      - "${BACKEND_HOST_BIND:-127.0.0.1}:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      # No `target` set — uses the Dockerfile's default (last) stage, `prod`,
      # which serves the pre-built static bundle via nginx on port 80.
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required (e.g. https://api.yourdomain.com)}
    environment:
      # Same origin as VITE_API_BASE_URL — allowed into the CSP connect-src
      # at container start (see frontend/nginx.conf.template).
      API_ORIGIN: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required (e.g. https://api.yourdomain.com)}
    ports:
      # Same reasoning as the backend's port binding above.
      - "${FRONTEND_HOST_BIND:-127.0.0.1}:${FRONTEND_HOST_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
